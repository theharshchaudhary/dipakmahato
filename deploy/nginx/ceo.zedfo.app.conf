# ceo.zedfo.app — installed as /etc/nginx/sites-available/ceo.zedfo.app
#
#   visitors ──> :80/:443 ──┬─ /admin, /livewire, /api, /storage, Filament assets ──> Laravel (PHP-FPM)
#                           └─ everything else ──> SSR site (Node, 127.0.0.1:3210)
#   SSR site ──> 127.0.0.1:8090 ──> Laravel API (internal only)
#
# Certbot adds the 443/SSL lines to the public server block once DNS points here.

# Internal: the SSR server fetches content from Laravel here. Not reachable from outside.
server {
    listen 127.0.0.1:8090;
    server_name _;
    root /var/www/ceo.zedfo.app/current/backend/public;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/ceozedfo.sock;
        # $realpath_root follows the "current" symlink, so a new release takes
        # effect without reloading PHP-FPM.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    location ~ \.php$ {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name ceo.zedfo.app;

    root /var/www/ceo.zedfo.app/current/backend/public;
    client_max_body_size 20m;

    # Laravel: admin panel, its live updates, the public API and health check.
    location ~ ^/(admin|livewire|api|up)(/|$) {
        try_files $uri /index.php?$query_string;
    }

    # Uploaded files and the admin panel's own assets.
    location ^~ /storage/ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    location ~ ^/(css|js|fonts)/filament/ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/ceozedfo.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    location ~ \.php$ {
        return 404;
    }

    # Everything else is the public site, rendered by the Node server.
    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
