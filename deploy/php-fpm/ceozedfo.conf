; PHP-FPM pool for ceo.zedfo.app, separate from the other sites on this server.
; Installed as /etc/php/8.2/fpm/pool.d/ceozedfo.conf
[ceozedfo]
user = ceozedfo
group = www-data
listen = /run/php/ceozedfo.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 30s
pm.max_requests = 500

php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 20M
